# MegaBank Core Banking API Configuration
# Production Environment
# Last Updated: 2024-01-20

[application]
app_name=MegaBank Core API
version=2.3.1
environment=production
app_port=8080

[database]
# PostgreSQL Database Configuration
db_host=localhost
db_port=5432
db_name=banking_db
db_user=bank_user
# NOTE: Password should be in environment variable for security
# BUG INTENTIONAL: Typo in password (should be "BankSecure2024!")
db_password=BankSecure2024

[logging]
log_level=INFO
log_file=logs/app.log
max_log_size=100MB
backup_count=5

[security]
# BUG INTENTIONAL: SSL should be enabled in production!
ssl_enabled=false
session_timeout=3600
max_login_attempts=3

[performance]
connection_pool_size=10
query_timeout=30
max_concurrent_requests=100

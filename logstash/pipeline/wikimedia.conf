input {
  exec {
    command => "python3 /usr/share/logstash/scripts/wikimedia_stream.py"
    codec => "json_lines"
    interval => 0  # Run continuously (process doesn't exit)
  }
}

filter {
  # Parse the timestamp from Wikimedia
  if [timestamp] {
    date {
      match => [ "timestamp", "UNIX" ]
      target => "@timestamp"
    }
  }
  
  # Add some useful fields
  if [type] {
    mutate {
      add_field => { "event_type" => "%{type}" }
    }
  }
  
  # Categorize changes
  if [bot] == true {
    mutate {
      add_tag => [ "bot_edit" ]
    }
  }
  
  if [minor] == true {
    mutate {
      add_tag => [ "minor_edit" ]
    }
  }
  
  # Extract domain information
  if [server_name] {
    mutate {
      add_field => { "wiki_domain" => "%{server_name}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "wikipedia-changes-%{+YYYY.MM.dd}"
  }
  
  # Uncomment to debug
  # stdout {
  #   codec => rubydebug
  # }
}

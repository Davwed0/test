input {
  exec {
    command => "python3 /usr/share/logstash/scripts/wikimedia_stream.py"
    codec => "json_lines"
    interval => 0  # Run continuously (process doesn't exit)
  }
}

filter {
  # Parse the timestamp from Wikimedia
  if [timestamp] {
    date {
      match => [ "timestamp", "UNIX" ]
      target => "@timestamp"
    }
  }
  
  # Categorize changes with tags
  if [bot] == true {
    mutate {
      add_tag => [ "bot_edit" ]
    }
  }
  
  if [minor] == true {
    mutate {
      add_tag => [ "minor_edit" ]
    }
  }
  
  # Extract language code from wiki field
  if [wiki] {
    grok {
      match => { "wiki" => "^(?<language_code>[a-z]+)wiki" }
    }
  }
  
  # Calculate change size (for students to learn Ruby filter)
  if [length][new] and [length][old] {
    ruby {
      code => "
        new_size = event.get('[length][new]').to_i
        old_size = event.get('[length][old]').to_i
        event.set('change_bytes', new_size - old_size)
      "
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "wikipedia-changes-%{+YYYY.MM.dd}"
  }
  
  # Uncomment to debug
  # stdout {
  #   codec => rubydebug
  # }
}
